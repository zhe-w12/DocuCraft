server {
    listen 5001 default_server;
    server_name _;
    root /opt/docucraft/frontend/dist;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:html|css|js|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
    }

    location ~ /\. {
        deny all;
    }
}
